version: "3.8"

services:
  openclaw-gateway:
    build: .
    container_name: openclaw-gateway
    ports:
      - "18888:18888"
    env_file:
      - .env
    environment:
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=18888
    restart: unless-stopped
    networks:
      - openclaw-net
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 18888)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    restart: unless-stopped
    networks:
      - openclaw-net

volumes:
  ollama-models:

networks:
  openclaw-net:
    driver: bridge
